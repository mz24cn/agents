[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Custom markers
markers =
    smoke: Fast critical-path tests (CI fast lane)
    regression: Full validation suite (CI full + CD gate)

# Output
# --durations keeps per-test timing visible for perf regression spotting.
# Parallel (requires: pip install pytest-xdist):  pytest -n auto
# Fast local lane (25 hypothesis examples):       HYPOTHESIS_PROFILE=fast pytest
addopts =
    -v
    --tb=short
    --strict-markers
    --durations=10

# Timeouts (if pytest-timeout is installed)
# timeout = 300

# Filter warnings that are expected / not-actionable
filterwarnings =
    ignore::DeprecationWarning:datetime\.datetime\.utcnow
    default::pytest.PytestReturnNotNoneWarning
