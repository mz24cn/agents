<svg xmlns="http://www.w3.org/2000/svg" width="800" height="140" viewBox="0 0 800 140">
  <defs>
    <!-- 主渐变：宝石蓝 → 青 → 紫 -->
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00d2ff"/>
      <stop offset="40%"  stop-color="#7b68ee"/>
      <stop offset="100%" stop-color="#c471f5"/>
    </linearGradient>
    <!-- 钻石 emoji 渐变 -->
    <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#00f5ff"/>
      <stop offset="50%"  stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <!-- 光晕滤镜 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- 投影 -->
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#7b68ee" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 背景装饰：微妙的光环 -->
  <circle cx="70" cy="70" r="55" fill="none" stroke="url(#gemGrad)" stroke-width="1.5" opacity="0.25"/>
  <circle cx="70" cy="70" r="42" fill="none" stroke="url(#gemGrad)" stroke-width="0.8" opacity="0.15"/>

  <!-- 💎 钻石 Emoji -->
  <text x="70" y="85" font-size="56" text-anchor="middle" filter="url(#glow)">💎</text>

  <!-- 「玲珑」中文字 -->
  <text x="145" y="82"
        font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',sans-serif"
        font-size="58" font-weight="700"
        fill="url(#mainGrad)" filter="url(#shadow)"
        letter-spacing="6">玲珑</text>

  <!-- Linglong Agent Service — 整体艺术化衬线斜体 -->
  <text x="308" y="84"
        font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Noto Serif SC',serif"
        font-size="40" font-weight="300" font-style="italic"
        fill="url(#mainGrad)" filter="url(#shadow)"
        letter-spacing="4">Linglong Agent Service</text>

  <!-- 底部装饰线 -->
  <line x1="145" y1="105" x2="850" y2="105"
        stroke="url(#mainGrad)" stroke-width="1.5" opacity="0.3"/>
  <line x1="145" y1="110" x2="700" y2="110"
        stroke="url(#mainGrad)" stroke-width="0.8" opacity="0.15"/>
</svg>
